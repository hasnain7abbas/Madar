name: Build Android APK

# Builds the Android .apk on GitHub's runners (the Tauri Android toolchain —
# JDK + Android SDK/NDK + Rust cross-targets — is too heavy to build locally).
# Triggers on the same v* tags as the desktop release so every artifact lands
# on one GitHub Release, plus manual dispatch for ad-hoc / re-attach builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the APKs to (e.g. v1.3.0). Blank = artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # Only the two ABIs real phones use — skips x86/x86_64 (emulator-only),
      # which roughly halves build time and dropped artifacts.
      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run tauri android init

      # Release build → applies the strip + LTO + opt-level="s" profile from
      # Cargo.toml; split-per-abi → one lean APK per architecture instead of a
      # fat universal one. Release APKs come out unsigned (signed below).
      - name: Build release APKs (per-ABI)
        run: npm run tauri android build -- --apk --split-per-abi

      # Sign with the persistent release keystore from repo secrets so every
      # build shares one signing identity and users can upgrade-install over
      # previous versions. If the secret is absent (e.g. a fork), fall back to
      # an ephemeral key so the workflow still produces a sideloadable APK.
      - name: Sign and align APKs
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          BT="$ANDROID_HOME/build-tools/34.0.0"
          KS="$RUNNER_TEMP/madar.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Signing with the persistent release keystore (repo secret)."
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS="$KEYSTORE_PASSWORD"; KEYPASS="$KEY_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "No keystore secret — falling back to an ephemeral key (sideload-only, non-upgradeable)."
            STOREPASS="madar123"; KEYPASS="madar123"; ALIAS="madar"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=Madar, O=Madar, C=PK"
          fi
          mkdir -p out
          echo "APKs produced by the build:"
          find src-tauri/gen/android -name "*-release-unsigned.apk" -print
          # tauri's split tokens are arm / arm64 / x86 / x86_64. Publish only the
          # two ARM ABIs real phones use; skip x86/x86_64 (emulator-only).
          for f in $(find src-tauri/gen/android -name "*-release-unsigned.apk"); do
            base=$(basename "$f")
            case "$base" in
              *arm64*) abi=arm64-v8a ;;
              *-arm-*|*armeabi*) abi=armeabi-v7a ;;
              *) echo "skip non-ARM ABI: $base"; continue ;;
            esac
            "$BT/zipalign" -f 4 "$f" aligned.apk
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass pass:"$STOREPASS" --key-pass pass:"$KEYPASS" \
              --out "out/Madar_${VERSION}_android_${abi}.apk" aligned.apk
            rm -f aligned.apk
          done
          echo "Signed APKs:"
          ls -la out
          for a in out/*.apk; do "$BT/apksigner" verify --print-certs "$a" | grep -i "SHA-256" | head -1; done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madar-${{ steps.apk.outputs.version }}-android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk
          fail_on_unmatched_files: true
